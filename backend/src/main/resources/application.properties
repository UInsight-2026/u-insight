spring.application.name=uinsight
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:uinsight}
spring.datasource.username=${DB_USERNAME:uinsight}
spring.datasource.password=${DB_PASSWORD:uinsight}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.h2.console.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.main.allow-bean-definition-overriding=true

# Integracion B1 (tendencia central) con A6 (calificaciones), A4 (secciones)
# y A1 (cursos, periodos academicos). En desarrollo todo corre en el mismo
# monolito, pero las URLs son configurables por variable de entorno para
# cuando cada celula se despliegue por separado.
uinsight.integration.a6.base-url=${A6_BASE_URL:http://localhost:8080}
uinsight.integration.a4.base-url=${A4_BASE_URL:http://localhost:8080}
uinsight.integration.a1.base-url=${A1_BASE_URL:http://localhost:8080}
