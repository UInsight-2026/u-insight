spring.application.name=u-insight
server.port=8080

# La base real se configura exclusivamente mediante variables de entorno.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:uinsight}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:uinsight}
spring.datasource.password=${DB_PASSWORD:uinsight}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

uinsight.trend.negative-threshold=${TREND_NEGATIVE_THRESHOLD:-3}
uinsight.trend.positive-threshold=${TREND_POSITIVE_THRESHOLD:3}
