spring.application.name=uinsight

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:uinsight}
spring.datasource.username=${DB_USERNAME:uinsight}
spring.datasource.password=${DB_PASSWORD:uinsight}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false


springdoc.swagger-ui.path=/swagger-ui.html
spring.application.name=backend
server.port=8080


spring.datasource.url=jdbc:h2:mem:teacherdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
