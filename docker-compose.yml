name: uinsight

services:
  backend:
    build:
      context: ./backend
    container_name: uinsight-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST_DOCKER:-host.docker.internal}
      DB_PORT: ${DB_PORT_DOCKER:-3307}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
