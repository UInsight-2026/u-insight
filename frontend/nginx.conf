server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Proxy hacia el backend: BACKEND_URL se sustituye en el arranque del
    # contenedor (ver Dockerfile, NGINX_ENVSUBST_FILTER) a partir de la
    # variable de entorno del mismo nombre, para no hardcodear el host del
    # backend en la imagen. En desarrollo con docker-compose, por defecto
    # apunta al servicio "backend" (ver docker-compose.yml).
    location /api/ {
        proxy_pass ${BACKEND_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
